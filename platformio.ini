; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:b-rms]
platform = espressif32
board = esp32dev
framework = arduino
board_build.embed_txtfiles = src/index.html

monitor_speed = 115200
; PID + time-proportioning ON/OFF output. Enable ADC only after wiring the divider.
build_flags =
    -D BUTTON_INPUT_PIN=32
    -D RGB_RED_PIN=18
    -D RGB_GREEN_PIN=19
    -D RGB_BLUE_PIN=23
    -D RGB_ACTIVE_HIGH=1
    -D BUZZER_OUTPUT_PIN=27
    -D BUZZER_ACTIVE=0
    -D BUZZER_ACTIVE_HIGH=1
    -D BUZZER_FREQUENCY_HZ=4000
    -D BUZZER_PULSE_MS=300
    -D SSR_OUTPUT_PIN=25
    -D PUMP_OUTPUT_PIN=26
    -D PUMP_RELAY_ACTIVE_HIGH=1
    -D INA226_ADDRESS=0x40
    -D INA226_SDA_PIN=21
    -D INA226_SCL_PIN=22
    -D INA226_SHUNT_OHMS=0.1f
    -D SSR_FEEDBACK_PIN=35
    -D SSR_FEEDBACK_ENABLED=0
upload_port = COM3

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    paulstoffregen/OneWire
    milesburton/DallasTemperature
