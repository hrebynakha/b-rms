<!DOCTYPE html>
{% load static %}
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="B-RMS - Brewery Remote Management System">
        <meta name="keywords" content="brewery, remote, management, system">
        {% block meta %}
        {% endblock meta %}
        <script defer
                src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
        {% block extra_head %}
        {% endblock extra_head %}
        <title>
            B-RMS |
            {% block title %}
            {% endblock title %}
        </title>
    </head>
    <body class="bg-body-tertiary">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark nav-fixed-top">
            <a class="navbar-brand ms-2" href="{% url 'brewery-list' %}">B-RMS</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <a class="navbar-brand" href="{% url 'recipe-list' %}">Recipes</a>
                    </li>
                    <li class="nav-item active">
                        <a class="navbar-brand" href="{% url 'brew-session-list' %}">Brew Sessions</a>
                    </li>
                </ul>
            </div>
        </nav>
        <main class="container main-content">
            {% block content %}
            {% endblock content %}
        </main>
    </body>
</html>
