<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Налаштування B-RMS</title>
    <style>
      :root { color-scheme: dark; --bg:#0f172a; --card:#1e293b; --primary:#d97706; --text:#f8fafc; --muted:#94a3b8; --border:#475569; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; padding:20px; display:grid; place-items:center; background:linear-gradient(135deg,#0f172a,#1e293b); color:var(--text); font-family:Inter,system-ui,sans-serif; }
      .card { width:min(480px,100%); padding:32px; border:1px solid rgba(255,255,255,.08); border-radius:24px; background:rgba(30,41,59,.96); box-shadow:0 20px 50px rgba(0,0,0,.35); }
      h1 { margin:0 0 6px; }
      .lead,.status { color:var(--muted); }
      label { display:block; margin:18px 0 7px; font-weight:600; }
      input,button { width:100%; padding:14px 16px; border-radius:12px; font:inherit; }
      input { border:1px solid var(--border); background:var(--bg); color:var(--text); }
      input:focus { outline:2px solid rgba(217,119,6,.35); border-color:var(--primary); }
      button { margin-top:22px; border:0; background:var(--primary); color:white; font-weight:700; cursor:pointer; }
      button:disabled { opacity:.6; cursor:wait; }
      .status { min-height:1.5em; margin-top:18px; text-align:center; }
      .status.error { color:#fca5a5; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>🍺 B-RMS</h1>
      <p class="lead">Початкове налаштування контролера броварні</p>
      <form id="config-form">
        <label for="ssid">Назва мережі Wi-Fi</label>
        <input id="ssid" autocomplete="off" required />
        <label for="password">Пароль Wi-Fi</label>
        <input id="password" type="password" autocomplete="new-password" />
        <label for="server">Адреса сервера B-RMS</label>
        <input id="server" type="url" value="http://beer.lan" required />
        <button id="submit-button" type="submit">Зберегти й перезапустити</button>
      </form>
      <div id="status" class="status" role="status"></div>
    </main>
    <script>
      const form = document.getElementById("config-form");
      const button = document.getElementById("submit-button");
      const status = document.getElementById("status");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        status.classList.remove("error");
        status.textContent = "Збереження налаштувань…";
        try {
          const response = await fetch("/api/config", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              ssid: document.getElementById("ssid").value.trim(),
              password: document.getElementById("password").value,
              server_url: document.getElementById("server").value.trim()
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Не вдалося зберегти налаштування");
          status.textContent = "Збережено. Контролер перезапускається…";
        } catch (error) {
          status.classList.add("error");
          status.textContent = error.message;
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
